[project]
name = "snakemake-report-plugin-nanopub"
version = "0.5.1"
description = "Reporter plugin for Snakemake using nanopub-py to create workflow metadata nanopubs"
readme = "README.md"
requires-python = ">=3.11,<4"
license = {text = "MIT"}
authors = [
    { name = "Christian Meesters", email = "meesters@csc.uni-frankfurt.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
keywords = ["snakemake", "plugin", "reporter", "nanopublication"]
dependencies = [
    "snakemake-interface-common>=1.23.0,<2",
    "snakemake-interface-report-plugins>=1.1.0,<3",
    "nanopub>=2.2.0",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Repository    = "https://github.com/snakemake/snakemake-report-plugin-nanopub"
Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/report/nanopub.html"

[project.scripts]
plot-nanopub-knowledge-graph = "snakemake_report_plugin_nanopub_cli:main"

[tool.codespell]
skip = ".git,*.pdf,*.svg,versioneer.py,*.css,test_*"
check-hidden = true

[tool.coverage.run]
omit = [".*", "*/site-packages/*", "Snakefile"]

[tool.coverage.report]
exclude_lines = [
  "pass",
  "\\.\\.\\.",
]
fail_under = 70.0

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
python_files = ["test_*.py", "tests.py"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
snakemake-report-plugin-nanopub = { path = ".", editable = true }

[tool.pixi.environments]
dev     = { features = ["test", "style"] }
quality = { features = ["style"] }
test = { features = ["test"] }
publish = { features = ["build"] }

[tool.pixi.feature.test.pypi-dependencies]
pytest    = ">=9.0.3,<10"
pytest-cov = ">=6.0.0,<7"
coverage  = ">=7.14.0,<8"
snakemake = ">=9.11.6,<10"
rdflib    = ">=7.1.0,<8"

[tool.pixi.feature.test.tasks]
test            = {cmd = "pytest", default-environment = "test"}
coverage-report = {cmd = "pytest --cov=src/snakemake_report_plugin_nanopub --cov=snakemake_report_plugin_nanopub_graph --cov-report=term-missing --cov-report=html", default-environment = "test"}

[tool.pixi.feature.style.pypi-dependencies]
ruff = ">=0.10.0,<0.11"

[tool.pixi.feature.style.tasks]
format = {cmd = "ruff format", default-environment = "quality"}
lint   = {cmd = "ruff check .", default-environment = "quality"}

[tool.pixi.feature.build.pypi-dependencies]
build = "*"
twine = "*"

[tool.pixi.feature.build.tasks]
build-check = {cmd = "python -m build && twine check dist/*"}

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
